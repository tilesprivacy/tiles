[package]
name = "tiles"
version = "0.4.13"
edition = "2024"

[dependencies]
tilekit = {path = "../tilekit"}
clap = { version = "4.5.48", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1" , features = ["macros", "process", "rt-multi-thread", "io-util"]}
owo-colors = "4"
futures-util = "0.3"
hf-hub = {version = "0.4", features = ["tokio"]}
rustyline = "18.0"
toml = "1.0.3"
semver = "1.0"
rusqlite = { version = "0.40.0", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.4.1"
uuid = {version = "1.21.0", features = ["v7"]}
axum = "0.8.8"
iroh = {version = "1.0.0"}
iroh-tickets = "1.0.0"
axum-macros = "0.5.0"
iroh-gossip = "0.101.0"
postcard = "1.1.3"
data-encoding = "2.10.0"
sha2 = "0.10.9"
iroh-blobs = "0.103.0"
log = "0.4.29"
env_logger = "0.11.10"
atrium-oauth = "0.1.7"
atrium-identity = "0.1.9"
hickory-resolver = "0.26.0"
atrium-common = "0.1.4"
atrium-api = "0.25.8"
libc = "0.2"
ctrlc = "3.5.2"
dialog-ucan = { git = "https://github.com/tilesprivacy/dialog-db", rev = "af442cac90d72c9da8be9c71799f497bddc62f0b", package = "dialog-ucan"}
dialog-credentials = { git = "https://github.com/tilesprivacy/dialog-db", rev = "af442cac90d72c9da8be9c71799f497bddc62f0b", package = "dialog-credentials"}
chacha20poly1305 = { version = "0.10" }
dialog-varsig= { git = "https://github.com/tilesprivacy/dialog-db", rev = "af442cac90d72c9da8be9c71799f497bddc62f0b", package = "dialog-varsig"}

serde_ipld_dagcbor = "0.6.4"
cid = "0.11.3"
keyring-core = "1.0.0"
iroh-mdns-address-lookup = "0.4.0"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[dev-dependencies]
keyring-core = { version = "1.0.0", features = ["sample"] }
wiremock = "0.6.5"
async-std = { version = "1.12", features = ["attributes"] }
serial_test = "3.4.0"
