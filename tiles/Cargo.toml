[package]
name = "tiles"
version = "0.4.8"
edition = "2024"

[dependencies]
tilekit = {path = "../tilekit"}
clap = { version = "4.5.48", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1" , features = ["macros", "rt-multi-thread"]}
owo-colors = "4"
futures-util = "0.3"
hf-hub = {version = "0.4", features = ["tokio"]}
rustyline = "17.0"
toml = "1.0.3"
semver = "1.0"
rusqlite = { version = "0.38.0", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.4.1"
uuid = {version = "1.21.0", features = ["v7"]}
axum = "0.8.8"
iroh = {version = "0.97.0", features = ["address-lookup-mdns"]}
iroh-tickets = "0.4.0"
axum-macros = "0.5.0"
iroh-gossip = "0.97.0"
postcard = "1.1.3"
data-encoding = "2.10.0"
sha2 = "0.10.9"
iroh-blobs = "0.99.0"
log = "0.4.29"
env_logger = "0.11.10"

[dev-dependencies]
tempfile = "3"
keyring = { version = "3", features = ["apple-native"] }
wiremock = "0.6.5"
async-std = { version = "1.12", features = ["attributes"] }
serial_test = "3.4.0"
