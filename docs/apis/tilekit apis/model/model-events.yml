info:
  name: model-events
  type: http
  seq: 6

http:
  method: GET
  url: "{{tilekit_base_url}}/model/events"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Server-sent `model` events that stay open: the unfinished downloads, then every change to any model's download, wherever it was started. Each event names its `model`
  type: text/markdown
