info:
  name: add-token
  type: http
  seq: 2

http:
  method: POST
  url: "{{tilekit_base_url}}/authz/add-token"
  body:
    type: json
    data: |-
      {
        "delegated_token": "",
        "token_type": "Sync",
        "nickname": "optional"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
