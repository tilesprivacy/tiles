http:
  method: POST
  url: "{{tilekit_base_url}}/engine/delete"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Deletes the downloaded engine and any download left half done, and returns the bytes freed. Replies go back to the CPU build that comes with Tiles, unless TILES_LLAMA_SERVER_BIN names another llama-server. 409 while an engine is downloading, 404 when none is downloaded
  type: text/markdown
