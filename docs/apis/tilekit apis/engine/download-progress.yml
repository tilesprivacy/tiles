info:
  name: download-progress
  type: http
  seq: 4

http:
  method: GET
  url: "{{tilekit_base_url}}/engine/download"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Server-sent `state` events: the current state, then each change, until the install is done, paused or failed. Each state names the `engine`, which changes when one fails its check and the next is tried.

    - `downloading` has `done`, `total` and `bytes_per_sec`
    - `unpacking`, then `checking`
    - `paused` has `done` and `total`
    - `done`, or `failed` with a `reason`

    Closing it doesn't stop the install, unless `pause_on_close=true` is sent with an `x-tiles-client` header.
  type: text/markdown
