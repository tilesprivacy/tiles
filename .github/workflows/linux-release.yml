name: Linux Release

# builds the Linux (x86_64) tarball whenever any tag is pushed (stable, rc,
# nightly) and attaches it to the tag's GitHub Release. One tarball ships
# every GPU backend; llama-server picks one at runtime.
# Can also be run manually (Actions tab -> Run workflow) from a branch
# (artifacts land on the run page) or from a tag ref (uploads into the
# release for that tag, e.g. re-publishing into an existing 0.4.17).
# A branch dispatch can additionally set `release_tag` to publish that
# branch's build into an existing tag's release (hotfix re-publish; the
# branch's Cargo.toml version should match the tag so asset names collide
# and overwrite cleanly).

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag whose release receives the assets (e.g. 0.4.18). Empty = run-page artifacts only."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — nothing here pushes git changes, so the
      # write-capable token has no business sitting in .git/config for the
      # rest of the job. The release upload uses the GITHUB_TOKEN env below.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No dtolnay/rust-toolchain here: its toolchain input is required and
      # hardcoding it drifts from the repo pin. Runners ship rustup, which
      # auto-installs the exact toolchain from rust-toolchain.toml on first use.

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install native dependencies and tools
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config jq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          # venvstacks 0.8.0 final was never uploaded to PyPI; install from the git tag
          pipx install "venvstacks @ git+https://github.com/lmstudio-ai/venvstacks.git@0.8.0"

      - name: Install just
        run: command -v just || cargo install just

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          package_manager_cache: false

      - name: Fetch Pi linux tarball
        run: |
          VERSION=$(grep '^pi' toolchain.toml | head -1 | awk -F'"' '{print $2}')
          echo "Using Pi ${VERSION} from toolchain.toml"
          curl -fL -o pi-linux-x64.tar.gz \
            "https://github.com/badlogic/pi-mono/releases/download/${VERSION}/pi-linux-x64.tar.gz"

      - name: Fetch llama-server
        run: ./scripts/fetch_llama_server.sh

      - name: Build bundle
        run: just bundle

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/tiles-v*.tar.gz
          if-no-files-found: error

  publish-linux:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum tiles-v*.tar.gz > checksums.txt
          cat checksums.txt

      # manual (non-tag) runs: the tarball already lands on the run page from
      # build-linux; only the checksums are unique to this job.
      - name: Upload checksums
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-checksums
          path: dist/checksums.txt
          if-no-files-found: error

      # Creates the release if missing, or uploads into the tag's existing
      # release (same-named assets are overwritten on re-runs; existing
      # release title/notes are preserved). Runs on tag pushes, or on a
      # branch dispatch with `release_tag` set — that publishes the
      # dispatched branch's build into the named tag's release.
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/tiles-v*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
