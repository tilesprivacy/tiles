<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tiles Error Report</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b;
    --card: #f5f5f4; --accent: #b45309; --border: #e5e5e3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131312; --fg: #ece9e4; --muted: #98938b; --card: #1d1c1a; --accent: #e8a33d; --border: #2a2927; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: start center; min-height: 100dvh; padding: 3rem 1rem;
  }
  main { width: min(44rem, 100%); }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .92rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; margin: 0 0 1rem; overflow-x: auto; }
  .k { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 .2rem; }
  pre { margin: 0; font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: .4rem .5rem; margin: 0 0 1rem; }
  .chip { border: 1px solid var(--border); border-radius: 999px; padding: .15rem .65rem; font-size: .78rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }
  .actions a, .actions button {
    appearance: none; border: 1px solid var(--border); background: var(--card); color: var(--fg);
    border-radius: 8px; padding: .5rem .9rem; font: inherit; font-size: .9rem; text-decoration: none; cursor: pointer;
  }
  .actions a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .privacy { color: var(--muted); font-size: .82rem; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: .9rem; }
  .error-state { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Tiles error report</h1>
  <p class="sub">Decoded on this device from the link itself. Nothing was uploaded.</p>
  <div id="out" class="error-state">Decoding&hellip;</div>

  <p class="privacy">
    How this works: the report is compressed into the part of the URL after
    <code>#</code>, which browsers never send to any server. Tiles machines
    transmit nothing on error; this link travels only where you take it.
  </p>
</main>

<script type="module">
  const out = document.getElementById('out');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  async function decode() {
    const match = location.hash.match(/z=([A-Za-z0-9_-]+)/);
    if (!match) {
      out.textContent = 'No report in this link. A report link looks like error.tiles.run/report#z=…';
      return;
    }

    const b64 = match[1].replaceAll('-', '+').replaceAll('_', '/');
    const bin = atob(b64.padEnd(b64.length + ((4 - (b64.length % 4)) % 4), '='));
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    const report = JSON.parse(await new Response(stream).text());

    const title = `[error] ${String(report.error).slice(0, 80)}`;
    const body = [
      '**What happened**', '', '<!-- describe what you were doing -->', '',
      '**Error**', '', '```', report.error, '```', '',
      `**Full report:** ${location.href}`, '',
      `Model: ${report.model ?? 'unknown'} · Component: ${report.component} · ${report.createdAt}`
    ].join('\n');
    const issueUrl = `https://github.com/tilesprivacy/tiles/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
    const mailUrl = `mailto:hello@tiles.run?subject=${encodeURIComponent('Tiles error: ' + String(report.error).slice(0, 60))}&body=${encodeURIComponent('Full report: ' + location.href + '\n\nWhat I was doing:\n')}`;

    out.classList.remove('error-state');
    out.innerHTML = `
      <div class="meta">
        ${['component', 'model', 'appVersion', 'userAgent', 'createdAt']
          .filter((k) => report[k])
          .map((k) => `<span class="chip">${esc(report[k])}</span>`)
          .join('')}
      </div>
      <div class="card"><p class="k">Error</p><pre>${esc(report.error ?? '')}</pre></div>
      ${report.logTail?.length ? `<div class="card"><p class="k">Log tail</p><pre>${esc(report.logTail.join('\n'))}</pre></div>` : ''}
      ${report.backtrace ? `<div class="card"><p class="k">Backtrace</p><pre>${esc(report.backtrace)}</pre></div>` : ''}
      <div class="actions">
        <a class="primary" href="${issueUrl}" target="_blank" rel="noreferrer">Open a GitHub issue</a>
        <a href="${mailUrl}">Email hello@tiles.run</a>
        <button id="copy" type="button">Copy report JSON</button>
      </div>`;

    document.getElementById('copy').addEventListener('click', async (ev) => {
      await navigator.clipboard.writeText(JSON.stringify(report, null, 2));
      ev.target.textContent = 'Copied';
    });
  }

  decode().catch((err) => {
    out.textContent = 'Could not decode this report link. It may be truncated. (' + err + ')';
  });
</script>
</body>
</html>
