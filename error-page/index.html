<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tiles Error Report</title>
<style>
  /* The Tiles palette: eight tokens, dark only - the same set the app and the
     macOS menubar panel use. This page commits to the single dark look. */
  :root {
    --signal: #f7ff61;
    --void: #111111;
    --bone: #ffffff;
    --ash: #d4d4d8;
    --slate: #8f8f9a;
    --steel: #1d1d1d;
    --rule: rgba(255, 255, 255, 0.1);
    --alert: #ff5f52;
    --radius: 10px;
    --cut: 4px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--void); color: var(--ash);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; place-items: start center; min-height: 100dvh; padding: 3rem 1rem;
  }
  main { width: min(46rem, 100%); }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; letter-spacing: -0.01em; color: var(--bone); }
  .sub { color: var(--slate); margin: 0 0 1.5rem; font-size: .92rem; }
  .card {
    background: var(--steel); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 1rem 1.25rem; margin: 0 0 .9rem;
    overflow-x: auto;
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  }
  .k { color: var(--slate); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 .35rem; }
  .card.error .k { color: var(--alert); }
  pre { margin: 0; font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; color: var(--ash); }
  .card.error pre { color: var(--bone); }
  .meta { display: flex; flex-wrap: wrap; gap: .4rem .5rem; margin: 0 0 1rem; }
  .chip {
    border: 1px solid var(--rule); border-radius: 999px; padding: .15rem .65rem;
    font: 11.5px ui-monospace, Menlo, monospace; color: var(--slate); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }
  .actions a, .actions button {
    appearance: none; border: 1px solid var(--rule); background: var(--steel); color: var(--bone);
    border-radius: var(--radius); padding: .5rem .95rem; font: inherit; font-size: .9rem;
    text-decoration: none; cursor: pointer; transition: background 140ms;
  }
  .actions a:hover, .actions button:hover { background: #262626; }
  .actions a.primary { background: var(--signal); border-color: var(--signal); color: var(--void); font-weight: 600; }
  .actions a.primary:hover { background: #e8f050; }
  .privacy { color: var(--slate); font-size: .82rem; margin-top: 2rem; border-top: 1px solid var(--rule); padding-top: .9rem; }
  .privacy code { font-family: ui-monospace, Menlo, monospace; color: var(--ash); }
  .error-state { color: var(--slate); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Tiles error report</h1>
  <p class="sub">Decoded on this device from the link itself. Nothing was uploaded.</p>
  <div id="out" class="error-state">Decoding&hellip;</div>

  <p class="privacy">
    How this works: the report is compressed into the part of the URL after
    <code>#</code>, which browsers never send to any server. Tiles machines
    transmit nothing on error; this link travels only where you take it.
  </p>
</main>

<script type="module">
  const out = document.getElementById('out');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  /* The tail arrives as one list with "== file ==" markers; each file gets
     its own box so daemon noise and inference noise stay tellable apart. */
  function splitLogSections(lines) {
    const sections = [];
    let current = null;
    for (const line of lines) {
      const marker = /^== (.+) ==$/.exec(line);
      if (marker) {
        current = { name: marker[1], lines: [] };
        sections.push(current);
      } else if (current) {
        current.lines.push(line);
      } else {
        current = { name: 'log', lines: [line] };
        sections.push(current);
      }
    }
    return sections.filter((s) => s.lines.length);
  }

  async function decode() {
    const match = location.hash.match(/z=([A-Za-z0-9_-]+)/);
    if (!match) {
      out.textContent = 'No report in this link. A report link looks like error.tiles.run/report#z=…';
      return;
    }

    const b64 = match[1].replaceAll('-', '+').replaceAll('_', '/');
    const bin = atob(b64.padEnd(b64.length + ((4 - (b64.length % 4)) % 4), '='));
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    const report = JSON.parse(await new Response(stream).text());

    const title = `[error] ${String(report.error).slice(0, 80)}`;
    const body = [
      '**What happened**', '', '<!-- describe what you were doing -->', '',
      '**Error**', '', '```', report.error, '```', '',
      `**Full report:** ${location.href}`, '',
      `Model: ${report.model ?? 'unknown'} · Component: ${report.component} · ${report.createdAt}`
    ].join('\n');
    const issueUrl = `https://github.com/tilesprivacy/tiles/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
    const mailUrl = `mailto:hello@tiles.run?subject=${encodeURIComponent('Tiles error: ' + String(report.error).slice(0, 60))}&body=${encodeURIComponent('Full report: ' + location.href + '\n\nWhat I was doing:\n')}`;

    const logSections = splitLogSections(report.logTail ?? []);

    out.classList.remove('error-state');
    out.innerHTML = `
      <div class="meta">
        ${['component', 'model', 'appVersion', 'userAgent', 'createdAt']
          .filter((k) => report[k])
          .map((k) => `<span class="chip" title="${esc(report[k])}">${esc(report[k])}</span>`)
          .join('')}
      </div>
      <div class="card error"><p class="k">Error</p><pre>${esc(report.error ?? '')}</pre></div>
      ${logSections
        .map((s) => `<div class="card"><p class="k">${esc(s.name)}</p><pre>${esc(s.lines.join('\n'))}</pre></div>`)
        .join('')}
      ${report.backtrace ? `<div class="card"><p class="k">Backtrace</p><pre>${esc(report.backtrace)}</pre></div>` : ''}
      <div class="actions">
        <a class="primary" href="${issueUrl}" target="_blank" rel="noreferrer">Open a GitHub issue</a>
        <a href="${mailUrl}">Email hello@tiles.run</a>
        <button id="copy" type="button">Copy report JSON</button>
      </div>`;

    document.getElementById('copy').addEventListener('click', async (ev) => {
      await navigator.clipboard.writeText(JSON.stringify(report, null, 2));
      ev.target.textContent = 'Copied';
    });
  }

  decode().catch((err) => {
    out.textContent = 'Could not decode this report link. It may be truncated. (' + err + ')';
  });
</script>
</body>
</html>
