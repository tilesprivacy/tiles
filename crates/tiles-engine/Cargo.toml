[package]
name = "tiles-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "time"] }
log = "0.4.29"
flate2 = "1.1.9"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.13.0"
libloading = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
