[[runtimes]]
name = "cpython3.13"
python_implementation = "cpython@3.13.11"
requirements = []
macosx_target = "14"
platforms = [
    "macosx_arm64",
]


[[applications]]
name = "server"
launch_module = "../../main.py"
runtime = "cpython3.13"
requirements = [
    "fastapi==0.140.0",
    "uvicorn==0.38.0",
    "openresponses-types==2.4.0",
    "httpx==0.28.1",
    ]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
exclude-newer = "2026-07-28T19:44:30+05:30"

[tool.uv.exclude-newer-package]
 tiles-harmony="2026-06-20T03:01:00Z"
 openresponses-types="2026-08-06T00:00:00Z"
 # 2026.10.19 drops the emSign ECC Root CA - G3 root (CVE-2026-111943)
 certifi="2026-10-21T00:00:00Z"
