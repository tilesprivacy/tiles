[project]
name = "server"
version = "0.1.0"
description = "Local inference server for the Tiles CLI"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
    "openresponses-types==2.4.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["backend", "backend.*"]

[tool.uv]
exclude-newer = "2026-07-28T19:44:30+05:30"

[tool.uv.exclude-newer-package]
openresponses-types = "2026-08-06T00:00:00Z"
# 2026.10.19 drops the emSign ECC Root CA - G3 root (CVE-2026-111943)
certifi = "2026-10-21T00:00:00Z"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
]
