[project]
name = "server"
version = "0.1.0"
description = "Local inference server for the Tiles CLI"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.130.0",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
    "openresponses-types",
    "tiles-harmony==0.0.8rc4"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["backend", "backend.*"]

[tool.uv]
exclude-newer = "2026-06-02T19:44:30+05:30"

[tool.uv.exclude-newer-package]
 tiles-harmony="2026-06-20T03:01:00Z"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
]
